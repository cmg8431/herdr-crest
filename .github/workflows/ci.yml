name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: sh -n install.sh && sh -n mods/crest/fetch-avatar.sh
      - run: shellcheck -S warning install.sh mods/crest/fetch-avatar.sh
