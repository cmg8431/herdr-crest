<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1600px;height:1000px;overflow:hidden;background:#0d1020}
  .bg{position:absolute;inset:-260px;filter:url(#brush) blur(2px);
    background:
      radial-gradient(55% 65% at 20% 30%, #3b4fb8 0%, transparent 60%),
      radial-gradient(50% 55% at 72% 18%, #1f7a8c 0%, transparent 62%),
      radial-gradient(50% 55% at 88% 88%, #6d3fb5 0%, transparent 60%),
      radial-gradient(45% 50% at 25% 95%, #164e63 0%, transparent 65%),
      linear-gradient(135deg, #172554 0%, #1e3a5f 45%, #2e1065 100%);}
  .stroke{position:absolute;filter:url(#rough)}
  .wrap{position:absolute;inset:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;color:#fff}
  .text{position:absolute;left:150px;top:330px;width:560px}
  h1{font-size:168px;line-height:1;margin:0 0 30px;font-weight:700;letter-spacing:-6px}
  p{font-size:40px;line-height:1.32;margin:0;color:rgba(255,255,255,.88);letter-spacing:-.4px}
  .stage{position:absolute;left:720px;top:120px;width:760px;height:760px;perspective:1800px}
  .panel{position:absolute;left:0;top:0;width:720px;border-radius:26px;overflow:hidden;background:#111317;padding:18px 14px 12px;
    transform:rotateY(-16deg) rotateX(6deg) rotateZ(1deg);transform-origin:left center;
    box-shadow:0 60px 120px rgba(4,6,20,.6),0 0 0 1px rgba(255,255,255,.09)}
  .panel img{display:block;width:100%}
  .card{position:absolute;left:-90px;top:560px;width:470px;border-radius:20px;overflow:hidden;background:#f1f0ea;padding:10px 8px 6px;
    transform:rotateY(-10deg) rotateX(4deg) rotateZ(-2deg);
    box-shadow:0 40px 80px rgba(4,6,20,.55),0 0 0 1px rgba(255,255,255,.4)}
  .card img{display:block;width:100%}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="230"/></filter>
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.08" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="38"/></filter>
</svg>
<div class="bg"></div>
<div class="stroke" style="right:60px;top:-60px;width:130px;height:520px;background:#e8564a;opacity:.9;border-radius:6px"></div>
<div class="stroke" style="left:-40px;bottom:-30px;width:260px;height:110px;background:#f3f1ea;opacity:.85;border-radius:8px"></div>
<div class="stroke" style="left:560px;top:-80px;width:360px;height:1200px;background:#2c4a8a;opacity:.33;transform:rotate(4deg)"></div>
<div class="wrap">
  <div class="text"><h1>Crest</h1><p>Faces and folders<br>for your Herdr spaces</p></div>
  <div class="stage">
    <div class="panel"><img src="sidebar-dark.png"></div>
    <div class="card"><img src="sidebar-light.png"></div>
  </div>
</div>
</body></html>
