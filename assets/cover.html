<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1600px;height:840px;overflow:hidden;background:#0d1020}
  .bg{position:absolute;inset:-260px;filter:url(#brush) blur(2px);
    background:
      radial-gradient(60% 70% at 18% 30%, #3b4fb8 0%, transparent 60%),
      radial-gradient(55% 60% at 70% 20%, #1f7a8c 0%, transparent 62%),
      radial-gradient(50% 55% at 85% 85%, #6d3fb5 0%, transparent 60%),
      radial-gradient(45% 50% at 30% 95%, #164e63 0%, transparent 65%),
      linear-gradient(135deg, #172554 0%, #1e3a5f 45%, #2e1065 100%);}
  .grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;filter:url(#grain)}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 110px;gap:90px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;color:#fff}
  .text{flex:1}
  h1{font-size:150px;line-height:1;margin:0 0 28px;font-weight:700;letter-spacing:-5px}
  p{font-size:38px;line-height:1.35;margin:0;color:rgba(255,255,255,.86);font-weight:400;letter-spacing:-.3px}
  .panel{width:540px;flex:none;border-radius:22px;overflow:hidden;background:#111317;padding:14px 10px 10px;
    box-shadow:0 40px 90px rgba(4,6,20,.55),0 0 0 1px rgba(255,255,255,.08)}
  .panel img{display:block;width:100%}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="230"/></filter>
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.08" numOctaves="4" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="38"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/></filter>
</svg>
<div class="bg"></div>
<div style="position:absolute;right:-30px;top:-40px;width:120px;height:560px;background:#e8564a;filter:url(#rough);opacity:.92;border-radius:6px"></div>
<div style="position:absolute;left:-40px;bottom:-30px;width:300px;height:120px;background:#f3f1ea;filter:url(#rough);opacity:.9;border-radius:8px"></div>
<div style="position:absolute;left:520px;top:-60px;width:340px;height:980px;background:#2c4a8a;filter:url(#rough);opacity:.35;transform:rotate(4deg)"></div>
<svg class="grain" width="1600" height="840"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<div class="wrap">
  <div class="text">
    <h1>Crest</h1>
    <p>Faces and folders<br>for your Herdr spaces</p>
  </div>
  <div class="panel"><img src="shot.png"></div>
</div>
</body></html>
